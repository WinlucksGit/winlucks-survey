<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Merchant Survey Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: KPI strip → daily responses → answer breakdowns grid → lead list */
:root{
  --purple:#60269E; --purple-2:#966EFF; --gold:#FDB614;
  --bg:#F6F3FB; --card:#FFFFFF; --ink:#1F1430; --muted:#6B5F80; --line:#E4DCF1; --tint:#F1EAFB;
  --hot:#C2410C; --hot-bg:#FFEDD5; --warm:#A16207; --warm-bg:#FEF3C7; --cold:#475569; --cold-bg:#E2E8F0;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#130C1F;--card:#1D1430;--ink:#F2ECFB;--muted:#B3A6C9;--line:#352850;--tint:#291D3F;--purple-2:#B1A4FF;--hot:#FDBA74;--hot-bg:#431407;--warm:#FDE68A;--warm-bg:#422006;--cold:#CBD5E1;--cold-bg:#1E293B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#130C1F;--card:#1D1430;--ink:#F2ECFB;--muted:#B3A6C9;--line:#352850;--tint:#291D3F;--purple-2:#B1A4FF;--hot:#FDBA74;--hot-bg:#431407;--warm:#FDE68A;--warm-bg:#422006;--cold:#CBD5E1;--cold-bg:#1E293B;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
header{background:var(--purple);color:#fff;padding-block:18px}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
header h1{font:800 22px/1.1 var(--display);margin:0}
header small{display:block;opacity:.85;font-weight:600}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.hbtns button{font:800 13px/1 var(--body);border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:rgba(255,255,255,.16);color:#fff}
.hbtns button.gold{background:var(--gold);color:#2B1A00}
.banner{background:var(--gold);color:#2B1A00;font-weight:800;font-size:14px;padding-block:9px;text-align:center}
main{padding-block:20px 40px}
main .wrap{display:grid;gap:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi span{display:block;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.kpi b{font:800 32px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi i{font-style:normal;font-size:13px;color:var(--muted);font-weight:700}
.kpi.hot b{color:var(--hot)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.panel h2{font:800 17px/1.2 var(--display);margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.hb{display:grid;gap:9px}
.hb div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:14px}
.hb em{font-style:normal;font-weight:800;font-variant-numeric:tabular-nums}
.hb em small{color:var(--muted);font-weight:700;margin-inline-start:4px}
.hb s{grid-column:1/-1;height:8px;background:var(--tint);border-radius:9px;overflow:hidden;text-decoration:none}
.hb s i{display:block;height:100%;background:var(--purple-2);border-radius:9px}
.hb div:first-child s i{background:var(--purple)}
.days{overflow-x:auto}
.days svg{display:block;min-width:520px;width:100%;height:auto}
.days text{fill:var(--muted);font:700 11px var(--body)}
.days .b{fill:var(--purple-2)} .days .b.last{fill:var(--gold)}
.days .g{stroke:var(--line)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tools button{font:800 13px/1 var(--body);border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 13px;cursor:pointer}
.tools button[aria-pressed=true]{background:var(--purple);border-color:var(--purple);color:#fff}
.tools input{flex:1;min-width:160px;font:inherit;padding:8px 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
th{text-align:start;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px;border-bottom:1.5px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-weight:800;font-size:12px;border-radius:999px;padding:3px 9px}
.pill.Hot{background:var(--hot-bg);color:var(--hot)} .pill.Warm{background:var(--warm-bg);color:var(--warm)}
.pill.Cold,.pill.Closed{background:var(--cold-bg);color:var(--cold)}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:700}
.wa{color:#1E8E4E;font-weight:800;text-decoration:none;white-space:nowrap}
.login{max-width:420px;margin:40px auto;display:grid;gap:12px}
.login input{font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.login button{font:800 16px/1 var(--display);background:var(--gold);color:#2B1A00;border:0;border-radius:12px;padding:14px;cursor:pointer}
.msg{color:var(--hot);font-weight:800}
.muted{color:var(--muted)}
</style>
</head>
<body>
<header class="pad"><div class="wrap">
  <div><h1>Merchant Survey Dashboard</h1><small id="updated">Winlucks · loading…</small></div>
  <div class="hbtns"><button id="refresh" class="gold" type="button">Refresh</button><button id="csv" type="button">Copy leads (CSV)</button><button id="logout" type="button">Lock</button></div>
</div></header>
<div class="banner pad" id="demo" hidden>Sample data — connect your Google Sheet (see SETUP.md) to see real responses.</div>

<main class="pad"><div class="wrap" id="app"></div></main>

<script>
/* =================== CONFIG =================== */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbwzIAlI5ZyghtqkC8LeYqhY5caoA-gjgC21JlZHo0t-93muUUxeROxwqWup9ncLhYLZjg/exec";
/* ============================================== */
const DEMO = ENDPOINT.indexOf("PASTE") === 0;
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let data = null, filter = "Hot", q = "";

function getKey(){ try{ return sessionStorage.getItem("wl_dash_key") || ""; }catch(_){ return ""; } }
function setKey(k){ try{ sessionStorage.setItem("wl_dash_key",k); }catch(_){} }

function login(msg){
  app.innerHTML = `<form class="panel login" id="lf"><h2>Enter dashboard key</h2>
    <p class="muted" style="margin:0">The key is the DASHBOARD_KEY you set in the Apps Script properties.</p>
    <input type="password" id="k" autocomplete="current-password" aria-label="Dashboard key">
    <button type="submit">Open dashboard</button>${msg?`<div class="msg">${esc(msg)}</div>`:""}</form>`;
  document.getElementById("lf").addEventListener("submit",e=>{ e.preventDefault(); setKey(document.getElementById("k").value.trim()); load(); });
}

async function load(){
  if(DEMO){ data = sample(); document.getElementById("demo").hidden = false; draw(); return; }
  const key = getKey(); if(!key) return login();
  document.getElementById("updated").textContent = "Winlucks · loading…";
  try{
    const r = await fetch(ENDPOINT + "?view=admin&key=" + encodeURIComponent(key));
    const j = await r.json();
    if(!j.ok){ setKey(""); return login(j.message || "Wrong key."); }
    data = j; draw();
  }catch(_){ app.innerHTML = `<div class="panel msg">Couldn't reach the Google Sheet. Check your internet and press Refresh.</div>`; }
}

function hbars(title, obj, total){
  const e = Object.entries(obj||{}).sort((a,b)=>b[1]-a[1]); const max = Math.max(1,...e.map(x=>x[1]));
  return `<section class="panel"><h2>${esc(title)}</h2><div class="hb">` + (e.length ? e.map(([k,v])=>
    `<div><span>${esc(k)}</span><em>${v}<small>${Math.round(v/Math.max(1,total)*100)}%</small></em><s><i style="width:${v/max*100}%"></i></s></div>`).join("") : `<p class="muted">No answers yet.</p>`) + `</div></section>`;
}

function daysChart(byDay){
  const days=[]; const end=new Date(); for(let i=20;i>=0;i--){ const d=new Date(end); d.setDate(d.getDate()-i); days.push(d.toISOString().slice(0,10)); }
  const vals=days.map(d=>byDay[d]||0), max=Math.max(4,...vals), top=Math.ceil(max/4)*4;
  const W=760,H=200,L=34,B=26,cw=(W-L-8)/days.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Surveys per day, last 21 days">`;
  for(let t=0;t<=4;t++){ const y=H-B-(H-B-12)*t/4; s+=`<line class="g" x1="${L}" x2="${W-4}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${top*t/4}</text>`; }
  vals.forEach((v,i)=>{ const h=(H-B-12)*v/top, x=L+i*cw+3, y=H-B-h;
    s+=`<rect class="b${i===vals.length-1?" last":""}" x="${x}" y="${y}" width="${cw-6}" height="${Math.max(h,0)}" rx="3"><title>${days[i]}: ${v}</title></rect>`;
    if(i%3===0||i===vals.length-1) s+=`<text x="${x+(cw-6)/2}" y="${H-8}" text-anchor="middle">${days[i].slice(5).replace("-","/")}</text>`; });
  return s+`</svg>`;
}

function draw(){
  const d=data, L=d.lead||{};
  document.getElementById("updated").textContent = "Winlucks · updated " + new Date().toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"});
  app.innerHTML = `
  <div class="kpis">
    <div class="kpi"><span>Surveys</span><b>${d.total}</b><i>${d.last7} in last 7 days</i></div>
    <div class="kpi hot"><span>Hot leads</span><b>${L.Hot||0}</b><i>Said "Yes" to joining</i></div>
    <div class="kpi"><span>Warm leads</span><b>${L.Warm||0}</b><i>Want more info</i></div>
    <div class="kpi"><span>Conversion</span><b>${d.total?Math.round(((L.Hot||0)+(L.Warm||0))/d.total*100):0}%</b><i>Hot + Warm ÷ surveys</i></div>
    <div class="kpi"><span>Bots blocked</span><b>${d.blocked}</b><i>See "Rejected" tab</i></div>
  </div>
  <section class="panel"><h2>Surveys per day · last 21 days</h2><div class="days">${daysChart(d.byDay||{})}</div></section>
  <div class="grid">
    ${hbars("Biggest challenge",d.challenge,d.total)}
    ${hbars("Pays platform commission?",d.commission,d.total)}
    ${hbars("Preferred payment model",d.payment,d.total)}
    ${hbars("What would make them try Winlucks",d.trigger,d.total)}
    ${hbars("Business type",d.category,d.total)}
    ${hbars("Emirate",d.emirate,d.total)}
    ${hbars("Where surveys came from",d.source,d.total)}
  </div>
  <section class="panel"><h2>Leads to follow up</h2>
    <div class="tools" role="group" aria-label="Filter leads">
      ${["Hot","Warm","Cold","All"].map(f=>`<button type="button" data-f="${f}" aria-pressed="${f===filter}">${f}</button>`).join("")}
      <input type="search" id="q" placeholder="Search business, area, rep…" value="${esc(q)}" aria-label="Search leads">
    </div>
    <div class="tbl" id="tbl"></div>
  </section>`;
  app.querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{ filter=b.dataset.f; app.querySelectorAll("[data-f]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.f===filter)); table(); }));
  document.getElementById("q").addEventListener("input",e=>{ q=e.target.value.toLowerCase(); table(); });
  table();
}
function visibleLeads(){
  return (data.leads||[]).filter(l=>(filter==="All"||l.lead===filter||(filter==="Cold"&&l.lead==="Closed")) &&
    (!q || [l.business,l.area,l.rep,l.name,l.emirate,l.code].join(" ").toLowerCase().includes(q)));
}
function table(){
  const rows = visibleLeads();
  document.getElementById("tbl").innerHTML = rows.length ? `<table><thead><tr><th>Date</th><th>Lead</th><th>Business</th><th>Type</th><th>Location</th><th>Contact</th><th>Code</th><th>Source</th></tr></thead><tbody>` +
    rows.map(l=>{ const m=String(l.mobile).replace(/\D/g,"").replace(/^(971|0)/,"");
      return `<tr><td class="num">${esc(l.date)}</td><td><span class="pill ${esc(l.lead)}">${esc(l.lead)}</span></td><td><b>${esc(l.business)}</b></td><td>${esc(l.category)}</td><td>${esc(l.emirate)}${l.area?" · "+esc(l.area):""}</td>
      <td>${esc(l.name)}<br><a class="wa" href="https://wa.me/971${esc(m)}" target="_blank" rel="noopener">WhatsApp 0${esc(m)}</a></td><td class="code">${esc(l.code)}</td><td>${esc(l.source)}${l.rep?" · "+esc(l.rep):""}${l.referredBy?"<br><small class=muted>ref "+esc(l.referredBy)+"</small>":""}</td></tr>`;}).join("") + `</tbody></table>`
    : `<p class="muted">No ${filter==="All"?"":filter.toLowerCase()+" "}leads${q?" matching your search":""} yet.</p>`;
}

document.getElementById("refresh").addEventListener("click",load);
document.getElementById("logout").addEventListener("click",()=>{ setKey(""); data=null; DEMO?load():login(); });
document.getElementById("csv").addEventListener("click",async e=>{
  if(!data) return;
  const cols=["date","lead","business","category","emirate","area","name","mobile","code","source","rep","referredBy"];
  const csv=[cols.join(",")].concat(visibleLeads().map(l=>cols.map(c=>`"${String(l[c]??"").replace(/"/g,'""')}"`).join(","))).join("\n");
  try{ await navigator.clipboard.writeText(csv); e.target.textContent="Copied ✓"; setTimeout(()=>e.target.textContent="Copy leads (CSV)",1800); }
  catch(_){ e.target.textContent="Copy blocked"; }
});

/* ---------- sample data (only used before the ENDPOINT is set) ---------- */
function sample(){
  let seed=7; const rnd=()=>((seed=seed*16807%2147483647)/2147483647);
  const pick=(a,w)=>{ let r=rnd()*w.reduce((x,y)=>x+y,0); for(let i=0;i<a.length;i++){ r-=w[i]; if(r<=0) return a[i]; } return a[0]; };
  const cats=["Restaurant / Café","Grocery / Minimart","Salon / Barbershop","Laundry","Car wash / Auto","Fashion / Beauty","Electronics / Mobile","Bakery / Sweets","Home services","Other"];
  const ems=["Dubai","Sharjah","Ajman","Abu Dhabi","Ras Al Khaimah","Umm Al Quwain","Fujairah"];
  const areas={Dubai:["Al Nahda","Karama","Al Qusais","Deira"],Sharjah:["Rolla","Al Majaz"],Ajman:["Al Nuaimiya","Al Rashidiya"],"Abu Dhabi":["Musaffah","Hamdan St"]};
  const ch=["Getting new customers","Getting customers to return","Increasing sales","Online visibility","Advertising costs","Platform commissions","Competition"];
  const co=["Yes, and it's worth it","Yes, but it's too expensive","No"], tr=["Free registration","Pay only when I get sales","Low commission","Free marketing support","Customer rewards / WL Coins","More customers"];
  const pm=["Commission only on sales","Fixed monthly fee","Free basic + paid extras","Not sure"], src=["field","whatsapp","meta","referral","qr"];
  const ints=["Hot","Warm","Cold","Closed"], reps=["Ahmed","Shafeeq","Rahul",""], names=["Al Noor","Golden Spoon","Star","Royal","City","Fresh","Smart","Blue Wave","Happy","Lucky"];
  const sfx={"Restaurant / Café":"Cafeteria","Grocery / Minimart":"Grocery","Salon / Barbershop":"Gents Salon","Laundry":"Laundry","Car wash / Auto":"Auto Care","Fashion / Beauty":"Fashion","Electronics / Mobile":"Mobile","Bakery / Sweets":"Bakery","Home services":"Technical Services","Other":"Trading"};
  const leads=[]; const now=Date.now();
  for(let i=0;i<186;i++){
    const dAgo=Math.floor(Math.pow(rnd(),1.6)*20), c=pick(cats,[22,18,16,6,5,7,9,7,4,6]), e=pick(ems,[46,22,14,10,4,2,2]);
    const t=new Date(now-dAgo*864e5-rnd()*8e7);
    leads.push({date:t.toISOString().slice(0,16).replace("T"," "),lead:pick(ints,[24,38,26,12]),business:"Sample "+names[i%10]+" "+sfx[c],category:c,emirate:e,
      area:(areas[e]||[""])[Math.floor(rnd()*(areas[e]||[""]).length)],name:"Sample contact",mobile:"05"+String(Math.floor(rnd()*1e8)).padStart(8,"0"),
      code:"WLF-"+Math.floor(rnd()*36**5).toString(36).toUpperCase().padStart(5,"X"),source:pick(src,[46,20,18,9,7]),rep:pick(reps,[3,3,2,4]),referredBy:"",
      _ch:pick(ch,[30,22,16,10,8,9,5]),_co:pick(co,[12,34,54]),_tr:pick(tr,[20,26,14,12,10,18]),_pm:pick(pm,[48,10,30,12])});
  }
  leads.sort((a,b)=>b.date.localeCompare(a.date));
  const cb=k=>leads.reduce((o,l)=>(o[l[k]]=(o[l[k]]||0)+1,o),{});
  const byDay=leads.reduce((o,l)=>(o[l.date.slice(0,10)]=(o[l.date.slice(0,10)]||0)+1,o),{});
  return {total:leads.length,last7:leads.filter(l=>now-new Date(l.date.replace(" ","T")).getTime()<7*864e5).length,blocked:23,
    lead:cb("lead"),category:cb("category"),emirate:cb("emirate"),challenge:cb("_ch"),commission:cb("_co"),trigger:cb("_tr"),payment:cb("_pm"),source:cb("source"),byDay,leads};
}
load();
</script>
</body>
</html>
