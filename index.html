<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Winlucks Merchant Survey</title>
<meta name="description" content="1-minute survey for UAE shop owners. Get your Founding Merchant code.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=Tajawal:wght@500;700;800&display=swap">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=wlTurnstileReady&render=explicit" async defer></script>
<style>
/* Layout: one short page — hero with the reward, 9 compact questions, then a thank-you screen with code + results */
:root{
  --purple:#60269E; --purple-2:#966EFF; --gold:#FDB614;
  --bg:#F7F4FC; --card:#FFFFFF; --ink:#1F1430; --muted:#6B5F80; --line:#E2DAF0; --tint:#F1EAFB;
  --err:#C0262D; --ok:#1E7B4A;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
:root[lang="ar"]{--display:"Tajawal",system-ui,sans-serif;--body:"Tajawal",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#140D20;--card:#1E1530;--ink:#F2ECFB;--muted:#B3A6C9;--line:#3A2D52;--tint:#2A1E40;--purple-2:#B1A4FF;--err:#FF8A8F;--ok:#6FD39C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#140D20;--card:#1E1530;--ink:#F2ECFB;--muted:#B3A6C9;--line:#3A2D52;--tint:#2A1E40;--purple-2:#B1A4FF;--err:#FF8A8F;--ok:#6FD39C;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto}
.hero{background:var(--purple);color:#fff;padding-block:18px 52px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-height:36px}
.brand img{width:min(230px,60vw);height:auto;display:block}
.brandname{font:800 21px/1 var(--display)}
.lang{font:700 14px/1 var(--body);background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:999px;padding:9px 14px;cursor:pointer}
.lang:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero h1{font:800 clamp(26px,6.5vw,36px)/1.12 var(--display);margin:18px 0 8px;text-wrap:balance}
.hero p{margin:0;opacity:.92;max-width:52ch}
.offer{margin-top:16px;background:var(--gold);color:#2B1A00;border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.offer b{font:800 17px/1.2 var(--display)}
.offer span{font-size:14px;font-weight:700}
main{padding-block:0 40px}
main .wrap{margin-top:-30px}
.stack{display:grid;gap:16px}
.pitch{gap:16px}
.pitch h2{font:800 22px/1.15 var(--display);margin:0;color:var(--purple)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pitch h2{color:var(--gold)}}
:root[data-theme="dark"] .pitch h2{color:var(--gold)}
.plead{margin:-6px 0 0;color:var(--muted);font-weight:600}
.benefits{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.benefits li{display:flex;gap:12px;align-items:flex-start;background:var(--tint);border-radius:12px;padding:12px}
.benefits svg{flex:none;width:34px;height:34px;padding:6px;border-radius:10px;background:var(--purple);fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.benefits b{display:block;font-weight:800}
.benefits span{display:block;font-size:14px;color:var(--muted);font-weight:600;line-height:1.4}
.how summary{cursor:pointer;font-weight:800;color:var(--purple-2);padding:4px 0}
.how ol{margin:10px 0 0;padding-inline-start:22px;display:grid;gap:8px}
.how li b{margin-inline-end:6px}
.how li span{color:var(--muted);font-weight:600}
.trust{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;font-weight:700;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.trust > span::before{content:"✓ ";color:var(--ok)}
.tel{user-select:all;direction:ltr;unicode-bidi:isolate}
.start{display:block;text-align:center;font:800 17px/1 var(--display);background:var(--purple);color:#fff;border-radius:12px;padding:15px;text-decoration:none}
.start:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;display:grid;gap:22px}
fieldset{border:0;margin:0;padding:0;min-width:0}
.q legend,.q .ql{font-weight:800;display:block;margin-bottom:10px;padding:0}
.qn{color:var(--purple-2);margin-inline-end:6px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;inset:0;opacity:0;margin:0;width:100%;height:100%;cursor:pointer}
.chip span{display:inline-flex;align-items:center;min-height:42px;padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;font-weight:700;font-size:15px;background:var(--card);transition:background .15s,border-color .15s}
.chip input:checked + span{background:var(--purple);border-color:var(--purple);color:#fff}
.chip input:focus-visible + span{outline:3px solid var(--gold);outline-offset:2px}
input[type=text],input[type=tel]{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px}
input[type=text]:focus-visible,input[type=tel]:focus-visible{outline:3px solid var(--gold);outline-offset:1px;border-color:var(--purple)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.two label{display:grid;gap:6px;font-weight:700;font-size:14px;color:var(--muted)}
.err{color:var(--err);font-size:13px;font-weight:800;margin-top:6px}
.q.invalid .chip span,.q.invalid input[type=text],.q.invalid input[type=tel]{border-color:var(--err)}
.hp{position:absolute!important;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);opacity:0;pointer-events:none}
form{position:relative}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.consent input{width:20px;height:20px;margin-top:2px;accent-color:var(--purple);flex:none}
.submit{font:800 19px/1 var(--display);background:var(--gold);color:#2B1A00;border:0;border-radius:14px;padding:17px;cursor:pointer;width:100%}
.submit:disabled{opacity:.55;cursor:not-allowed}
.submit:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.status{font-weight:800;font-size:14px;min-height:1.2em}
.status.bad{color:var(--err)}
.done{text-align:center;gap:16px}
.done h2{font:800 28px/1.15 var(--display);margin:0;color:var(--purple)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .done h2{color:var(--gold)}}
:root[data-theme="dark"] .done h2{color:var(--gold)}
.code{font:800 30px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:3px;background:var(--tint);border:2px dashed var(--purple-2);border-radius:14px;padding:16px;user-select:all}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{font:800 15px/1 var(--body);border-radius:12px;padding:13px 16px;border:1.5px solid var(--purple);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none}
.btn.wa{background:#1E8E4E;border-color:#1E8E4E;color:#fff}
.results{text-align:start;display:grid;gap:14px;border-top:1px solid var(--line);padding-top:16px}
.results h3{font:800 18px/1.2 var(--display);margin:0}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:4px 10px;align-items:center;font-size:14px}
.bar .track{grid-column:1/-1;height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--purple-2)}
.bar b{text-align:end;font-variant-numeric:tabular-nums}
footer{text-align:center;color:var(--muted);font-size:12px;padding-block:0 28px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

/* Options: value saved is always English (v), label shown in the chosen language */
const Q = [
 {n:1,k:"business_name",type:"text",ac:"organization"},
 {n:2,k:"category",type:"chips",o:[["Restaurant / Café","مطعم / مقهى"],["Grocery / Minimart","بقالة / ميني ماركت"],["Salon / Barbershop","صالون / حلاقة"],["Laundry","مغسلة ملابس"],["Car wash / Auto","غسيل سيارات / خدمات سيارات"],["Fashion / Beauty","أزياء / تجميل"],["Electronics / Mobile","إلكترونيات / هواتف"],["Bakery / Sweets","مخبز / حلويات"],["Home services","خدمات منزلية"],["Other","أخرى"]]},
 {n:3,k:"emirate",type:"chips",o:[["Abu Dhabi","أبوظبي"],["Dubai","دبي"],["Sharjah","الشارقة"],["Ajman","عجمان"],["Umm Al Quwain","أم القيوين"],["Ras Al Khaimah","رأس الخيمة"],["Fujairah","الفجيرة"]],extra:{k:"area",t:"q3b"}},
 {n:4,k:"biggest_challenge",type:"chips",o:[["Getting new customers","جذب زبائن جدد"],["Getting customers to return","عودة الزبائن"],["Increasing sales","زيادة المبيعات"],["Online visibility","الظهور على الإنترنت"],["Advertising costs","تكلفة الإعلانات"],["Platform commissions","عمولات المنصات"],["Competition","المنافسة"]]},
 {n:5,k:"pays_commission",type:"chips",o:[["Yes, and it's worth it","نعم، وتستحق"],["Yes, but it's too expensive","نعم، لكنها مرتفعة"],["No","لا"]]},
 {n:6,k:"try_trigger",type:"chips",o:[["Free registration","تسجيل مجاني"],["Pay only when I get sales","أدفع فقط عند البيع"],["Low commission","عمولة منخفضة"],["Free marketing support","دعم تسويقي مجاني"],["Customer rewards / WL Coins","مكافآت الزبائن / عملات WL"],["More customers","زبائن أكثر"]]},
 {n:7,k:"payment_model",type:"chips",o:[["Commission only on sales","عمولة على المبيعات فقط"],["Fixed monthly fee","رسوم شهرية ثابتة"],["Free basic + paid extras","أساسي مجاني + إضافات مدفوعة"],["Not sure","غير متأكد"]]},
 {n:8,k:"interest_joining",type:"chips",o:[["Yes","نعم"],["Maybe — need more info","ربما — أحتاج معلومات أكثر"],["Not now","ليس الآن"],["No","لا"]]},
 {n:9,k:"contact",type:"contact"}
];

let lang = "en";
try{ lang = localStorage.getItem("wl_lang") || (navigator.language||"").startsWith("ar") && "ar" || "en"; }catch(_){}
const form = document.getElementById("survey");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  const t = T[lang], keep = snapshot();
  document.documentElement.lang = lang; document.documentElement.dir = lang==="ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent = t[el.dataset.t]);
  document.getElementById("langBtn").textContent = t.lang;
  let h = "";
  Q.forEach(q=>{
    const lab = `<span class="qn">${q.n}.</span>${esc(t["q"+q.n])}`;
    if(q.type==="text") h += `<div class="q" id="q_${q.k}"><label class="ql" for="${q.k}">${lab}</label><input type="text" id="${q.k}" name="${q.k}" maxlength="100" autocomplete="${q.ac}"><div class="err" hidden></div></div>`;
    if(q.type==="chips"){
      h += `<fieldset class="q" id="q_${q.k}"><legend>${lab}</legend><div class="chips">` +
        q.o.map((o,i)=>`<label class="chip"><input type="radio" id="${q.k}_${i}" name="${q.k}" value="${esc(o[0])}"><span>${esc(lang==="ar"?o[1]:o[0])}</span></label>`).join("") + `</div>`;
      if(q.extra) h += `<input type="text" id="${q.extra.k}" name="${q.extra.k}" maxlength="60" placeholder="${esc(t[q.extra.t])}" aria-label="${esc(t[q.extra.t])}" style="margin-top:10px">`;
      h += `<div class="err" hidden></div></fieldset>`;
    }
    if(q.type==="contact") h += `<div class="q" id="q_contact"><span class="ql">${lab}</span><div class="two"><label for="contact_person">${esc(t.name)}<input type="text" id="contact_person" name="contact_person" maxlength="60" autocomplete="name"></label><label for="mobile">${esc(t.mobile)}<input type="tel" id="mobile" name="mobile" maxlength="20" autocomplete="tel" inputmode="tel" placeholder="05X XXX XXXX" dir="ltr"></label></div><div class="err" hidden></div></div>`;
  });
  h += `<div class="hp" aria-hidden="true"><label for="company_website">Website</label><input type="text" id="company_website" name="company_website" tabindex="-1" autocomplete="off"></div>
    <label class="consent" for="consent"><input type="checkbox" id="consent" name="consent"><span>${esc(t.consent)}</span></label>
    <div id="turnstile"></div>
    <button class="submit" type="submit" id="submitBtn">${esc(t.submit)}</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>`;
  form.innerHTML = h;
  restore(keep);
  if(window.turnstile && USE_TURNSTILE) mountTs();
}
function snapshot(){ const o={}; form.querySelectorAll("input").forEach(i=>{ if(i.type==="radio"||i.type==="checkbox"){ if(i.checked) o[i.id]=true; } else if(i.value) o[i.id]=i.value; }); return o; }
function restore(o){ Object.entries(o).forEach(([id,v])=>{ const el=document.getElementById(id); if(!el) return; if(v===true) el.checked=true; else el.value=v; }); }

document.getElementById("langBtn").addEventListener("click",()=>{ lang = lang==="en"?"ar":"en"; try{localStorage.setItem("wl_lang",lang)}catch(_){} render(); if(!document.getElementById("done").hidden) showDone(lastCode, lastStats); });

/* ---------- human signals ---------- */
const startedAt = Date.now(); const human = {keys:0,pointer:0};
addEventListener("keydown",e=>{ if(e.isTrusted) human.keys++; },{passive:true});
addEventListener("pointerdown",e=>{ if(e.isTrusted) human.pointer++; },{passive:true});

/* ---------- Turnstile ---------- */
let tsToken = "", tsWidget = null;
function mountTs(){
  const el = document.getElementById("turnstile"); if(!el) return; tsToken = "";
  tsWidget = turnstile.render(el,{sitekey:TURNSTILE_SITE_KEY,theme:"auto",language:lang,action:"merchant_survey",
    callback:t=>{tsToken=t;}, "expired-callback":()=>{tsToken="";}, "error-callback":()=>{tsToken="";}});
}
window.wlTurnstileReady = () => { if(USE_TURNSTILE) mountTs(); };

/* ---------- validation ---------- */
const val = k => { const c=form.querySelector(`[name="${k}"]:checked`); if(c) return c.value; const e=form.querySelector(`[name="${k}"]`); return e && e.type!=="radio" ? e.value.trim() : ""; };
const mobileOk = v => /^(971|0)?5\d{8}$/.test(v.replace(/\D/g,""));
function mark(k,msg){ const w=document.getElementById("q_"+k); w.classList.toggle("invalid",!!msg); const e=w.querySelector(".err"); e.hidden=!msg; e.textContent=msg||""; }
function validate(){
  const t=T[lang]; let first=null;
  Q.forEach(q=>{
    let msg="";
    if(q.type==="text" && !val(q.k)) msg=t.reqT;
    if(q.type==="chips" && !val(q.k)) msg=t.req;
    if(q.type==="contact"){ if(!val("contact_person")||!val("mobile")) msg=t.reqT; else if(!mobileOk(val("mobile"))) msg=t.badMob; }
    mark(q.type==="contact"?"contact":q.k,msg); if(msg&&!first) first=q;
  });
  return first;
}
const setStatus=(m,bad)=>{const s=document.getElementById("status");s.textContent=m;s.className="status"+(bad?" bad":"");};

/* ---------- submit ---------- */
let lastCode="", lastStats=null;
form.addEventListener("change",e=>{ const q=e.target.closest(".q"); if(q && q.classList.contains("invalid")) validate(); });
form.addEventListener("submit",async e=>{
  e.preventDefault(); const t=T[lang];
  const bad = validate();
  if(bad){ document.getElementById("q_"+(bad.type==="contact"?"contact":bad.k)).scrollIntoView({behavior:"smooth",block:"center"}); setStatus(t.missing,true); return; }
  if(!document.getElementById("consent").checked){ setStatus(t.consentErr,true); return; }
  const elapsed = Math.round((Date.now()-startedAt)/1000);
  if(document.getElementById("company_website").value){ showDone("WLF-"+Math.random().toString(36).slice(2,7).toUpperCase(),null); return; } // honeypot: fake success
  if(CONFIGURED && (navigator.webdriver || elapsed<MIN_SECONDS || human.pointer+human.keys<5)){ setStatus(t.fast,true); return; }
  if(!CONFIGURED){ showDone("WLF-PREVIEW", null); setPreviewNote(); return; }
  if(USE_TURNSTILE && !tsToken){ setStatus(t.tsErr,true); return; }

  const answers={}; ["business_name","category","emirate","area","biggest_challenge","pays_commission","try_trigger","payment_model","interest_joining","contact_person","mobile"].forEach(k=>answers[k]=val(k));
  const payload={answers,source:SRC,rep:REP,referredBy:REF,lang,turnstileToken:tsToken,hp:"",elapsedSec:elapsed,signals:human};
  const btn=document.getElementById("submitBtn"); btn.disabled=true; setStatus(t.sending);
  try{
    const r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    const j=await r.json();
    if(j.ok){ showDone(j.code,j.stats); }
    else{ setStatus(j.message||t.fail,true); btn.disabled=false; try{turnstile.reset(tsWidget)}catch(_){} tsToken=""; }
  }catch(_){ setStatus(t.net,true); btn.disabled=false; }
});

function setPreviewNote(){ const p=document.createElement("p"); p.style.cssText="margin:0;font-weight:800;color:var(--err)"; p.textContent = lang==="ar" ? "معاينة: لم يتم حفظ الإجابات بعد." : "Preview: answers are not saved yet."; document.getElementById("done").prepend(p); }
function showDone(code,stats){
  lastCode=code; lastStats=stats; const t=T[lang];
  form.hidden=true; document.getElementById("pitch").hidden=true; const d=document.getElementById("done"); d.hidden=false;
  document.getElementById("code").textContent=code;
  const link = PUBLIC_URL + "?ref=" + encodeURIComponent(code) + "&src=referral";
  document.getElementById("waBtn").href = "https://wa.me/?text=" + encodeURIComponent(t.shareMsg + link);
  const res=document.getElementById("results");
  if(stats && stats.total>=20){
    const pct=n=>Math.round(n/stats.total*100);
    const top=Object.entries(stats.challenge||{}).sort((a,b)=>b[1]-a[1]).slice(0,4);
    res.innerHTML=`<h3>${esc(t.resT)}</h3><div><b style="font:800 26px var(--display)">${stats.total}</b> ${esc(t.resN)}</div>
      <div class="bar"><span>${esc(t.resInt)}</span><b>${pct(stats.wantJoin)}%</b><div class="track"><i style="width:${pct(stats.wantJoin)}%"></i></div></div>
      <div class="bar"><span>${esc(t.resCom)}</span><b>${pct(stats.commissionTooHigh)}%</b><div class="track"><i style="width:${pct(stats.commissionTooHigh)}%"></i></div></div>
      <div style="font-weight:800">${esc(t.resChal)}</div>` +
      top.map(([k,v])=>{const o=Q[3].o.find(x=>x[0]===k);return `<div class="bar"><span>${esc(lang==="ar"&&o?o[1]:k)}</span><b>${pct(v)}%</b><div class="track"><i style="width:${pct(v)}%"></i></div></div>`;}).join("");
    res.hidden=false;
  } else res.hidden=true;
  scrollTo({top:0,behavior:"smooth"});
}
document.getElementById("copyBtn").addEventListener("click",async e=>{
  try{ await navigator.clipboard.writeText(lastCode); e.target.textContent=T[lang].copied; }
  catch(_){ const r=document.createRange(); r.selectNodeContents(document.getElementById("code")); getSelection().removeAllRanges(); getSelection().addRange(r); }
});

render();
</script>
</body>
